name: Container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          build-args: GARAGE_ADMIN_REVISION=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Garage Admin
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test runtime image
        run: |
          docker run -d --name console -p 127.0.0.1:3000:3000 \
            -e CONSOLE_URL=http://localhost:3000 -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_PASSWORD="$(openssl rand -hex 24)" "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"
          trap 'docker logs console; docker rm -fv console' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsS http://localhost:3000/ -o /tmp/login.html
          grep -q 'Administrator password' /tmp/login.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/audit)" = 401
          curl -fsS http://localhost:3000/preview-viewer.html -o /dev/null
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(-t "$image:latest"); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tags+=(-t "$image:$GITHUB_REF_NAME"); fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
